name: Update weather data

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at :17 past
  workflow_dispatch:            # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-weather-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch new readings
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
          WEATHERLINK_STATION_ID: ${{ secrets.WEATHERLINK_STATION_ID }}
        run: python update_data.py

      - name: Commit if data changed
        run: |
          git config user.name "weather-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/readings.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update weather data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
